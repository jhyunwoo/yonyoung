name: quality-gate

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

jobs:
  pr-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_UPLOAD_MODE: mock
      E2E_SUITE_MODE: smoke
      E2E_ROLE_MATRIX: core
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: API Tests
        run: pnpm api:test

      - name: Web Unit Tests
        run: pnpm --filter web test:unit

      - name: Web E2E Smoke
        run: pnpm --filter web test:e2e:smoke

  main-full-gate:
    name: Main Full Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: true
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_UPLOAD_MODE: mock
      E2E_SUITE_MODE: full
      E2E_ROLE_MATRIX: all
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: API Coverage
        run: pnpm api:test:coverage

      - name: Web Unit Coverage
        run: pnpm --filter web test:unit:coverage

      - name: Web E2E Full
        run: pnpm --filter web test:e2e:full
