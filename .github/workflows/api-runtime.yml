name: API Runtime CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  api-runtime:
    name: API runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Determine API impact
        id: affected
        run: |
          pnpm turbo ls --affected --output=json > "$RUNNER_TEMP/affected.json"
          node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/affected.json","utf8"));const names=new Set(data.packages.items.map((item)=>item.name));fs.appendFileSync(process.env.GITHUB_OUTPUT,`api=${names.has("@yonyoung/api")}\n`);'

      - name: No affected API package
        if: ${{ steps.affected.outputs.api != 'true' }}
        run: echo "API is not affected; runtime checks are a successful no-op."

      - name: Verify generated Cloudflare bindings
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: |
          pnpm turbo run cf-typegen --affected
          git diff --exit-code -- apps/api/worker-configuration.d.ts

      - name: Workers runtime tests
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: pnpm turbo run test:workers --affected

      - name: Runtime integration tests
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: pnpm turbo run test:integration --affected

      - name: Cloudflare production dry run
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: pnpm turbo run deploy:dry-run --affected

      - name: Production dependency audit
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: pnpm turbo run security:audit --affected
