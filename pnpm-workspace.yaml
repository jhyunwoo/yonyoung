packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: false

overrides:
  "@esbuild-kit/core-utils>esbuild": "0.28.2"

allowBuilds:
  "@sentry/cli": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

ignoredBuiltDependencies:
  - unrs-resolver

onlyBuiltDependencies:
  - "@sentry/cli"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - workerd

minimumReleaseAgeExclude:
  - "@sentry/browser-utils@10.75.2"
  - "@sentry/browser@10.75.2"
  - "@sentry/core@10.75.2"
  - "@sentry/feedback@10.75.2"
  - "@sentry/nextjs@10.75.2"
  - "@sentry/node-core@10.75.2"
  - "@sentry/node@10.75.2"
  - "@sentry/opentelemetry@10.75.2"
  - "@sentry/react@10.75.2"
  - "@sentry/replay-canvas@10.75.2"
  - "@sentry/replay@10.75.2"
  - "@sentry/server-utils@10.75.2"
  - "@sentry/vercel-edge@10.75.2"
  - "@sentry/cloudflare@10.75.2"
