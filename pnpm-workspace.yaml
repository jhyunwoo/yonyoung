packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: false

overrides:
  "@esbuild-kit/core-utils>esbuild": "0.28.2"
  # Both Wrangler and the Workers test pool pin sharp; use its latest patched release.
  "miniflare>sharp": "0.35.5"

allowBuilds:
  "@sentry/cli": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - eslint@10.12.0
