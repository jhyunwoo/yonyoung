name = "yonyoung-api"
main = "src/index.ts"
compatibility_date = "2026-02-13"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "yonyoung-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "yonyoung-assets"

[vars]
BETTER_AUTH_URL = "http://localhost:3000"

[observability]
enabled = true

[env.production.vars]
BETTER_AUTH_URL = "https://your-web-domain.workers.dev"
